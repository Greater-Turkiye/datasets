name: auto-records

# Turns the collector's relevant candidates into unverified event records and commits them to the
# `auto-data` branch (handbook ADR 0023). `main` stays the human-reviewed record; the Pages build lays
# the automatic records over it, so the site shows both and says which is which. Every record says it
# is automatic and unverified; nothing about Turkish forces goes this way; every file passes
# `gt.py validate` and `fmt --check` before it is committed.
#
# Kill switch: the repository variable AUTO_RECORDS must be `on`. Set it to `off` and this writes
# nothing (Settings -> Secrets and variables -> Actions -> Variables, or
# `gh variable set AUTO_RECORDS --body off -R Greater-Turkiye/datasets`).

on:
  schedule:
    - cron: "41 6 * * *"   # after the collector's 05:23 UTC run
    - cron: "41 18 * * *"  # a second pass picks up anything the model could not reach in the morning
  workflow_dispatch:
    inputs:
      days:
        description: Batches from the last N days
        default: "3"
        type: string

permissions:
  contents: write   # commit the records to the auto-data branch (main is protected and stays human-reviewed)
  actions: write    # start the Pages build: pushes made with GITHUB_TOKEN do not trigger it

concurrency:
  group: auto-records
  cancel-in-progress: false

jobs:
  records:
    if: vars.AUTO_RECORDS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Check out auto-data, up to date with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin auto-data; then
            git checkout -q -B auto-data FETCH_HEAD
            # main wins: a record a person has since moved to main and edited keeps the person's version
            git merge -q --no-edit -X theirs origin/main
          else
            git checkout -q -B auto-data
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days || '3' }}
        run: python tools/auto_records.py --days "$DAYS"
      - name: Validate and check formatting
        run: |
          python tools/gt.py validate
          python tools/gt.py fmt --check
      - name: Commit
        id: commit
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(git diff --cached --name-only --diff-filter=A | wc -l)
          git commit -q -m "Automatic records: $n unverified events from the collector (ADR 0023)"
          git push -q origin auto-data
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the site data
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
