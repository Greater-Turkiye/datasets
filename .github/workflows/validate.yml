name: validate

# Runs on every PR (no path filters) so the required status check always reports.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate records
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python tools/gt.py validate --base "origin/$BASE_REF"
          else
            python tools/gt.py validate
          fi
      - name: Check formatting
        run: python tools/gt.py fmt --check
      - name: Build exports
        run: python tools/gt.py build
      - name: Unit tests
        run: |
          pip install "pytest>=9,<10"
          python -m pytest -q tests
