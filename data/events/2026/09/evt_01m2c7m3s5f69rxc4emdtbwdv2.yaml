title:
  tr: "Ermenistan ve Hindistan, genelkurmaylar arasında yeni işbirliği çerçevesini belirleyen belgeyi teati etti"
  en: "Armenia and India exchanged a document setting a new framework for cooperation between their general staffs"
summary:
  tr: "Armenpress'in aktardığı Ermenistan Savunma Bakanlığı açıklamasına göre, 17 Ağustos 2026'da Ermenistan Silahlı Kuvvetleri Genelkurmay Başkanı ile Hindistan Savunma Müsteşarı, iki ülke silahlı kuvvetlerinin genelkurmayları arasında yeni bir işbirliği çerçevesi belirleyen belgeyi teati etti. Teati, Hindistan Savunma Müsteşarı'nın Ermenistan'a yaptığı resmî ziyaret sırasında ve daha önce varılan bir mutabakat kapsamında gerçekleşti. Belgenin içeriği açıklanmadı; bilgi tek bir yayın organına dayanıyor."
  en: "According to an Armenian Defence Ministry readout reported by Armenpress, on 17 August 2026 the Chief of the General Staff of the Armenian Armed Forces and India's Defence Secretary exchanged a document establishing a new framework for cooperation between the general staffs of the two countries' armed forces. The exchange took place during the Indian Defence Secretary's official visit to Armenia, as part of a previously reached agreement. The content of the document was not disclosed; the information rests on a single outlet."
