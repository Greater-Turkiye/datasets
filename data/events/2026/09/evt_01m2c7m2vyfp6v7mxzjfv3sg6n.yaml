title:
  tr: Bulgaristan, Romanya ve İspanya hava kuvvetleri sınır ötesi NATO hava polisliği anlaşması imzaladı
  en: Bulgarian, Romanian and Spanish air forces signed a NATO cross-border air policing agreement
summary:
  tr: Bulgaristan Savunma Bakanlığı'nın 6 Ağustos 2026'daki açıklamasına göre Bulgaristan, Romanya ve İspanya hava kuvvetleri, sınır ötesi NATO hava polisliği operasyonlarına ilişkin üçlü bir teknik anlaşma imzaladı. Anlaşma, Bulgaristan ile Romanya hükümetleri arasındaki 2021 tarihli anlaşmaya dayanıyor ve üçüncü bir ülkenin, bu durumda İspanya'nın, nöbetçi savaş uçaklarının sınır ötesi hava polisliğine katılmasını mümkün kılıyor. Açıklamaya göre Romanya'da konuşlu İspanyol unsurları, NATO Entegre Hava ve Füze Savunma Sistemi (NATINAMDS) çerçevesinde Romanya hava sahasında ve gerektiğinde Bulgaristan hava sahasında devriye görevi yapabilecek. İmzanın tarihi ve yeri açıklanmadı.
  en: According to a Bulgarian Defence Ministry statement on 6 August 2026, the air forces of Bulgaria, Romania and Spain signed a trilateral technical agreement on NATO cross-border air policing operations. The agreement is based on a 2021 accord between the governments of Bulgaria and Romania and allows on-duty fighter aircraft of a third country, in this case Spain, to take part in cross-border air policing. According to the statement, Spanish forces deployed in Romania will be able to perform air patrol tasks in Romanian airspace and, if necessary, in Bulgarian airspace within the NATO Integrated Air and Missile Defence System (NATINAMDS). The date and place of signing were not given.
