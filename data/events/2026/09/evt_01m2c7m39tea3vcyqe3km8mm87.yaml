title:
  tr: Kazakistan Savunma Bakanlığı, 'Batyl Toitarys-2026' tatbikatı için ülke genelinde birlik intikali duyurdu
  en: Kazakhstan's Defence Ministry announced nationwide troop movements for exercise 'Batyl Toitarys-2026'
summary:
  tr: TASS ve Caspian Post'un aktardığı Kazakistan Savunma Bakanlığı açıklamasına göre, 'Batyl Toitarys-2026' ('Kararlı Püskürtme') stratejik komuta-kurmay tatbikatı kapsamında silah, askerî teçhizat ve personel Ağustos ve Eylül 2026 boyunca ülke genelindeki eğitim sahalarına demiryolu, karayolu konvoyları ve hava araçlarıyla intikal ettirilecek. Bakanlık 3 Ağustos'ta yaptığı açıklamada tatbikatın kara, hava, deniz ve siber alanda birlik intikali ile kuvvetler arası koordinasyonu sınamayı amaçladığını belirtti. Yabancı katılımdan söz edilmedi.
  en: According to a Kazakh Defence Ministry statement reported by TASS and Caspian Post, weapons, military equipment and personnel will be moved to training areas across the country during August and September 2026 by rail, road convoys and aircraft for the 'Batyl Toitarys-2026' ('Decisive Repulse') strategic command-and-staff exercise. In its 3 August statement the ministry said the exercise would test troop deployment and inter-service coordination on land, in the air, at sea and in cyberspace. No foreign participation was mentioned.
