title:
  tr: GKRY ve Yunanistan, Doğu Akdeniz'de 'Salamis-03/26' arama-kurtarma tatbikatı yaptı
  en: The Greek Cypriot Administration and Greece held search-and-rescue exercise 'Salamis-03/26' in the Eastern Mediterranean
summary:
  tr: Larnaka Ortak Kurtarma Koordinasyon Merkezi'nin (JRCC) açıklamasına göre, 2 Eylül 2026'da Doğu Akdeniz'de 'Salamis-03/26' adlı ortak arama-kurtarma tatbikatı yapıldı; tatbikat Larnaka JRCC tarafından Yunan Deniz Kuvvetleri Komutanlığı ile işbirliği içinde koordine edildi. Cyprus Mail'e göre Yunan fırkateynleri Nikiforos Fokas ve Hydra, Rum Millî Muhafız Ordusu'nun Ioannidis karakol gemisi ve 460. Arama-Kurtarma Filosu'na ait bir helikopter, Rum polisine ait bir helikopter ve bir sağlık tahliye (MEDEVAC) ekibi katıldı.
  en: According to the Larnaca Joint Rescue Coordination Centre (JRCC), a joint search-and-rescue exercise named 'Salamis-03/26' took place in the Eastern Mediterranean on 2 September 2026, coordinated by the Larnaca JRCC in cooperation with the Hellenic Navy General Staff. According to Cyprus Mail, participants included the Greek frigates Nikiforos Fokas and Hydra, the National Guard patrol vessel Ioannidis and a helicopter of its 460 Search and Rescue Squadron, a Greek Cypriot police helicopter and a medical evacuation (MEDEVAC) team.
