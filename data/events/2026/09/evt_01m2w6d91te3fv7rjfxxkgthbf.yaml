title:
  tr: BM Güvenlik Konseyi, İran yaptırımları uzmanlar panelinin görev süresini yenilemedi
  en: The UN Security Council did not renew the mandate of the Iran sanctions Panel of Experts
summary:
  tr: Güvenlik Konseyi 17 Eylül 2026'daki 10224'üncü oturumunda, İran yaptırımları uzmanlar panelinin görev süresini yenileyen karar tasarısını kabul edemedi. Hem usul hem esas oylamasında sonuç 11 kabul, 2 ret (Çin, Rusya Federasyonu) ve 2 çekimser (Pakistan, Somali) oldu; daimî üyelerin ret oyu tasarıyı düşürdü. Oturumda ABD panelin "yasaklı ikili savunma iş birliğine ışık tutacağını", Letonya sonucun "BM yaptırım mimarisini zayıflatan kasıtlı bir örüntünün parçası" olduğunu söyledi; Rusya snapback mekanizmasının işletilmesinin "ne hakkı ne de gerekçesi" bulunduğunu, Çin ise Konsey'in tarafları "eşit zeminde müzakereye" yöneltmesi gerektiğini savundu. Bu kayıt, oturumda söylenenleri aktarmaktadır; nitelendirmeler konuşan devletlere aittir.
  en: At its 10224th meeting on 17 September 2026 the Security Council failed to adopt the draft resolution renewing the mandate of the Iran sanctions Panel of Experts. Both the procedural and the substantive vote were 11 in favour, 2 against (China, the Russian Federation) and 2 abstentions (Pakistan, Somalia); the negative votes of permanent members defeated the text. The United States said the panel would have "shined a light on prohibited bilateral defensive cooperation"; Latvia called the outcome part of "a deliberate pattern of weakening UN sanctions architecture"; the Russian Federation said the invocation of snapback had "no right nor justification", and China said the Council should facilitate negotiations "on equal footing". This record relays what was said at the meeting; the characterisations belong to the states that made them.
