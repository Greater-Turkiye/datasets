title:
  tr: Yunanistan ve İsrail, 'Achilles Shield' hava ve füze savunma sistemi için anlaşma imzaladı
  en: Greece and Israel signed an agreement for the 'Achilles Shield' air and missile defence system
summary:
  tr: Yunanistan Millî Savunma Bakanlığı ile İsrail Savunma Bakanlığı, 31 Ağustos 2026'da Tel Aviv'de Yunanistan için çok katmanlı bir hava ve füze savunma sistemi ('Achilles Shield') kurulmasına ilişkin anlaşmayı imzaladı. Al Jazeera ve JTA'ya göre anlaşmanın değeri yaklaşık 3,5 milyar USD'dir; paket David's Sling, SPYDER ve Barak MX sistemlerini, çok görevli radarları ve bir komuta-kontrol merkezini kapsıyor. Aynı gün Drone Dome sistemleri için ayrı ve daha küçük bir sözleşme de imzalandı (Al Jazeera'ya göre 26 milyon EUR). JTA'nın aktardığına göre İsrail Savunma Bakanlığı anlaşmayı İsrail-Yunanistan ilişkilerindeki en büyük savunma ihracatı olarak tanımladı.
  en: The Hellenic Ministry of National Defence and the Israel Ministry of Defense signed an agreement in Tel Aviv on 31 August 2026 for a multi-layered air and missile defence system for Greece ('Achilles Shield'). According to Al Jazeera and JTA the deal is worth about USD 3.5 billion and covers the David's Sling, SPYDER and Barak MX systems, multi-mission radars and a command-and-control centre. A separate, smaller contract for Drone Dome systems was signed the same day (EUR 26 million according to Al Jazeera). JTA reported that the Israeli Defence Ministry described it as the largest defence export deal in the history of Israel-Greece relations.
