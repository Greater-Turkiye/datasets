title:
  tr: Türkiye, Brezilya ile Savunma Sanayii İş Birliği Anlaşması'nı onayladı
  en: Türkiye ratified the Defence Industry Cooperation Agreement with Brazil
summary:
  tr: 18 Eylül 2026 tarihli Resmî Gazete'de yayımlanan 11799 sayılı Cumhurbaşkanı Kararı ile "Türkiye Cumhuriyeti Hükümeti ile Brezilya Federatif Cumhuriyeti Hükümeti arasında Savunma Sanayi İşbirliği Anlaşması" ve ekli notalar onaylandı. Anlaşma 25 Mart 2022'de imzalanmış, TBMM'nin onay kanunu (7586 sayılı Kanun) 4 Temmuz 2026'da Resmî Gazete'de yayımlanmıştı; Cumhurbaşkanı kararı onay sürecinin son adımıdır. Habere göre anlaşma, iki ülkenin yetkili kurumları ve savunma sanayii kuruluşları arasında savunma ürün ve hizmetlerinin geliştirilmesi, üretimi, tedariki ve bakımı ile teknik ve lojistik destek alanlarında iş birliğini kapsıyor.
  en: Presidential Decision 11799, published in the Official Gazette of 18 September 2026, approved the "Defence Industry Cooperation Agreement between the Government of the Republic of Türkiye and the Government of the Federative Republic of Brazil" together with its annexed notes. The agreement was signed on 25 March 2022 and the Turkish parliament's approving law (Law 7586) was published in the Official Gazette on 4 July 2026; the presidential decision is the final step of ratification. As reported, the agreement covers cooperation between the two states' authorised bodies and defence industry organisations in the development, production, supply and maintenance of defence goods and services, and in technical and logistic support.
