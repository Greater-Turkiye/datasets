title:
  tr: "Romanya Hava Kuvvetleri, 14-25 Eylül'de ülke genelinde 'Burebista 26' tatbikatı düzenleyeceğini duyurdu"
  en: "The Romanian Air Force announced exercise 'Burebista 26' across Romania for 14-25 September"
summary:
  tr: "București FM'in aktardığı Romanya Hava Kuvvetleri Kurmay Başkanlığı duyurusuna göre Romanya Hava Kuvvetleri, 14-25 Eylül 2026 tarihleri arasında tüm ülke genelinde 'Burebista 26' tatbikatını yapacak. Tatbikata Hava Kuvvetleri'nin komuta-kontrol ve icra unsurları katılacak; Kara Kuvvetleri ve Özel Harekât Kuvvetleri destek verecek. Duyuruya göre tatbikat süresince karayolu üzerinde askerî araç intikalleri ve ülkenin tüm bölgelerinde alçak irtifa uçuşları yapılacak. Yabancı katılımdan söz edilmedi."
  en: "According to a Romanian Air Force Staff announcement reported by București FM, the Romanian Air Force will hold exercise 'Burebista 26' across the whole country from 14 to 25 September 2026. Air Force command-and-control and execution structures will take part, supported by the Land Forces and Special Operations Forces. According to the announcement, military vehicles will move along roads and low-altitude flights will take place in all regions of the country. No foreign participation was mentioned."
