title:
  tr: GKRY, Yunanistan, ABD, İtalya ve Almanya savaş gemileri Leymosun açıklarında 'Cyprus Arrow' tatbikatı yaptı
  en: Warships from the Greek Cypriot Administration, Greece, the US, Italy and Germany held exercise 'Cyprus Arrow' off Limassol
summary:
  tr: Cyprus Mail'in aktardığı Rum Millî Muhafız Ordusu açıklamasına göre, 17 Ağustos 2026'da Leymosun'un (Limasol) güneyindeki sularda 'Cyprus Arrow' adlı çok uluslu bir deniz tatbikatı yapıldı. Tatbikata Rum Millî Muhafız Ordusu'na ait Ioannides açık deniz karakol gemisi, Yunan fırkateyni Nikiforos Fokas, ABD muhribi Paul Ignatius, İtalyan fırkateyni Carabiniere ve Alman fırkateyni Baden-Württemberg katıldı. Açıklama 20 Ağustos'ta yapıldı; bilgi tek bir yayın organına dayanıyor.
  en: According to a Greek Cypriot National Guard statement reported by Cyprus Mail, a multinational naval exercise named 'Cyprus Arrow' took place in waters south of Limassol on 17 August 2026. Participants were the National Guard offshore patrol vessel Ioannides, the Greek frigate Nikiforos Fokas, the US destroyer Paul Ignatius, the Italian frigate Carabiniere and the German frigate Baden-Württemberg. The statement was released on 20 August; the information rests on a single outlet.
