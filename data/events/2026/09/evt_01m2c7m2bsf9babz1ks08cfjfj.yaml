title:
  tr: "BAE Savunma Bakanlığı: İran'dan fırlatılan iki balistik füze denize düştü; İran suçlamayı reddetti"
  en: UAE Defence Ministry said two ballistic missiles launched from Iran fell into the sea; Iran rejected the accusation
summary:
  tr: BAE Savunma Bakanlığı'na göre 18 Ağustos 2026'da hava savunma sistemleri İran'dan gelen iki balistik füze tespit etti; füzelerden biri BAE karasuları dışına, diğeri içine düştü. Bakanlık daha sonra yaptığı değerlendirmede füzelerin deniz seyrüseferini hedef aldığını açıkladı. Al Jazeera'ya göre İran Dışişleri Bakanlığı Sözcüsü suçlamayı 'asılsız' olarak reddetti ve olayı 'sahte bayrak operasyonu' olarak niteledi; BAE Dışişleri Bakanlığı ise 19 Ağustos'ta İran ile ticareti süresiz olarak durdurduğunu duyurdu. Fırlatma yeri ve fail bağımsız olarak doğrulanmadı.
  en: According to the UAE Ministry of Defence, its air defences detected two ballistic missiles coming from Iran on 18 August 2026; one fell outside UAE territorial waters and the other inside them. In a later assessment the ministry said the missiles had targeted maritime navigation. According to Al Jazeera, Iran's foreign ministry spokesperson rejected the accusation as 'baseless' and called it a 'false flag operation'; the UAE foreign ministry announced an indefinite halt to trade with Iran on 19 August. The launch point and perpetrator have not been independently verified.
