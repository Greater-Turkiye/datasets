title:
  tr: "Suriye ve Rusya, Hmeymim ve Tartus'taki Rus askerî varlığını yeniden düzenleyen mutabakat zaptı imzaladı"
  en: "Syria and Russia signed a memorandum reorganising the Russian military presence at Hmeimim and Tartus"
summary:
  tr: "Suriye Dışişleri Bakanlığı'nın 9 Ağustos 2026'daki açıklamasına göre (SANA), yaklaşık 18 aylık müzakerelerin ardından Suriye ile Rusya, Rusya'nın Suriye kıyısındaki varlığını yeniden düzenleyen bir mutabakat zaptına vardı. Açıklamaya göre Suriye, Hmeymim Havalimanı ve Tartus Limanı'nın dördüncü ticari rıhtımı dahil sivil kullanıma ayrılan tesislerin yönetimini devralacak; askerî amaçla kullanılan Rus üsleri ortak eğitim ve yeterlilik merkezlerine dönüştürülecek ve geçiş en geç üç ay içinde tamamlanacak. The Moscow Times'ın aktardığına göre Rusya Dışişleri Bakanlığı, 9 Ağustos'ta imzalanan mutabakatı askerî alanda ikili işbirliğini geliştirmeye yönelik önemli bir adım olarak nitelendirdi."
  en: "According to a statement by the Syrian Ministry of Foreign Affairs on 9 August 2026 (SANA), Syria and Russia reached a memorandum reorganising Russia's presence on the Syrian coast after about 18 months of negotiations. According to the statement, Syria will take over management of facilities designated for civilian use, including Hmeimim Airport and the fourth commercial berth at Tartus port; Russian military bases will be turned into joint training and qualification centres, and the transition is to be completed within three months. According to The Moscow Times, the Russian Foreign Ministry described the memorandum signed on 9 August as an important step towards improving bilateral military cooperation."
