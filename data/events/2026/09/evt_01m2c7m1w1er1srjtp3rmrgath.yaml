title:
  tr: Yunanistan, Mısır, Fransa, İtalya ve GKRY kuvvetleri Girit açıklarında MEDUSA 2026 tatbikatına katıldı
  en: Forces from Greece, Egypt, France, Italy and the Greek Cypriot Administration took part in exercise MEDUSA 2026 off Crete
summary:
  tr: Cyprus Mail'e göre çok uluslu MEDUSA 2026 tatbikatı kapsamında 10 Eylül 2026'da Girit'in güneyinde Yunanistan, Mısır, Fransa, İtalya ve GKRY kuvvetlerinin katıldığı deniz ve hava faaliyetleri yapıldı; tatbikat alanı Yunanistan'ın güneydoğu Girit Denizi için yayımladığı NAVTEX ile ayrıldı. Yunan Deniz Kuvvetleri Hidrografi Dairesi'nin 10 Eylül'de yayımladığı NAVTEX'lere göre aynı tatbikat kapsamında 16 Eylül'de Mirtoa Denizi'ndeki Karavia atış sahasında 05.00-09.00 UTC arası atışlı eğitim ve 12.30-14.30 UTC arası hava tatbikatı, 17 Eylül 00.01 UTC ile 19 Eylül 12.00 UTC arasında ise Kuzey Girit Denizi'nde bir demirleme sahası duyuruldu.
  en: According to Cyprus Mail, naval and air activities of the multinational exercise MEDUSA 2026 took place south of Crete on 10 September 2026 with forces from Greece, Egypt, France, Italy and the Greek Cypriot Administration; the area was reserved through a Greek NAVTEX for the south-eastern Cretan Sea. NAVTEX notices published by the Hellenic Navy Hydrographic Service on 10 September announced, for the same exercise, live firing in the Karavia firing practice area in the Myrtoan Sea on 16 September (05:00-09:00 UTC), an air exercise there the same day (12:30-14:30 UTC) and an anchorage area in the northern Cretan Sea from 00:01 UTC on 17 September to 12:00 UTC on 19 September.
