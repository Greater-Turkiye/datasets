  note:
    tr: Başlangıç tarihi, 10 Eylül 2026 (Perşembe) tarihli haberdeki 'perşembe' ifadesine dayanıyor. Bitiş, NAVTEX ile duyurulan son MEDUSA 2026 faaliyetinin (demirleme sahası) bitişidir; tatbikatın resmî bitiş tarihi doğrulanmadı. 16-19 Eylül faaliyetleri duyuru niteliğindedir.
    en: Start date rests on 'on Thursday' in the article dated Thursday 10 September 2026. The end is the end of the last NAVTEX-announced MEDUSA 2026 activity (anchorage area); the official end of the exercise was not confirmed. The 16-19 September activities are announcements.
