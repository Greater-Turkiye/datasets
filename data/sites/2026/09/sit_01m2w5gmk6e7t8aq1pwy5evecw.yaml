description:
  tr: "Semadirek adasındaki askerî varlığın antlaşma yükümlülüğü karşısındaki durumunu izleyen kayıt. Lozan (1923) md. 12 adayı Yunan egemenliğinde sayar; askerden arındırılmış statüsü Lozan'a ek Boğazlar Sözleşmesi'nden gelir ve 1936 Montrö sonrası statüsü taraflarca tartışmalıdır. Türkiye statünün sürdüğü görüşündedir. Kayıtta koordinat ve geometri **yoktur**: bir koordinat, birincil kaynağıyla doğrulanmadan yazılmaz (ADR 0019). OpenStreetMap'te (ODbL, sorgu 2026-09-19, yalnızca Yunan toprağı) adada askerî olarak etiketlenmiş 12 nesne kayıtlı: bunker 8, barracks 1, base 1, trench 1, military 1. Bunlar doğrulanacak ipuçlarıdır: gönüllü etiketleri bir tesisin bugün faal olduğunu kanıtlamaz; İkinci Dünya Savaşı'ndan kalma mevziler de aynı etiketi taşıyabilir. Kayıt bir uyum kaydıdır; güncel hareket, personel ve zafiyet bilgisi içermez ve içermeyecektir."
  en: "A record tracking the military presence on Samothrace against its treaty obligation. Lausanne (1923) Art. 12 confirms Greek sovereignty; the demilitarised status derives from the Straits Convention annexed to Lausanne, and what Montreux (1936) did to it is disputed between the parties. Türkiye holds that it stands. It carries **no coordinates and no geometry**: a coordinate is written when it has been verified against a primary source, not before (ADR 0019). OpenStreetMap (ODbL, queried 2026-09-19, Greek territory only) has 12 features tagged as military on the island: bunker 8, barracks 1, base 1, trench 1, military 1. These are leads to verify: a volunteer's tag does not prove a facility is in use today — Second World War positions carry the same tag. This is a compliance record: it carries no current movements, no personnel and no vulnerability assessment, and it never will."
