description:
  tr: "Midilli adasında konuşlu, Yunan Kara Kuvvetlerine bağlı ada komutanlığı. Lozan Barış Antlaşması (1923) md. 13: adada deniz üssü ve istihkâm kurulamaz, Yunan kuvvetleri \"normal contingent called up for military service\" ile sınırlıdır. Bu kayıt, adadaki kalıcı askerî varlığın antlaşma yükümlülüğü karşısındaki durumunu izlemek için açılmıştır. Komutanlığın varlığı ve konuşlandığı ada bugün yalnızca ikincil bir kaynağa dayanmaktadır; birincil kaynak (Yunan Genelkurmayı veya Resmî Gazetesi), kuruluş tarihi ve tesis dökümü hâlâ **doğrulanmamıştır**. Kayıttaki nokta, OpenStreetMap'te **Στρατηγείο 98 ΑΔΤΕ** adıyla çizilmiş alanın merkezidir (ODbL, `way/881040840`, sorgu 2026-09-20); hata payı ±500 m, çizilen alanın yarısı kadar. Gönüllü etiketi birincil kaynak değildir: nokta, komutanlığın karargâhının haritada gösterildiği yerdir, resmî bir koordinat listesi değil (ADR 0021). Kayıt, hedefleme verisi değil, antlaşma uyum kaydıdır: güncel hareket, personel ve zafiyet bilgisi içermez ve içermeyecektir. OpenStreetMap'te (ODbL, sorgu 2026-09-19, yalnızca Yunan toprağı) adada askerî olarak etiketlenmiş 8 nesne kayıtlı: military 6, barracks 1, range 1. Adlandırılmış olanlar: 221 ΤΕ - Στρατόπεδο Μακρή; ΣΕΑΛ; Στρατηγείο 98 ΑΔΤΕ; Στρατόπεδο Βούτσικα; Στρατόπεδο Κυριαζή; Polixnitos Firing Range. Bunlar doğrulanacak ipuçlarıdır: gönüllülerin etiketlediği kayıtlar bu komutanlığa ait olduklarını kanıtlamaz ve etiketlerin güncelliği denetlenmemiştir."
  en: "The Hellenic Army island command based on Lesbos. Treaty of Lausanne (1923) Art. 13: no naval base and no fortification may be established on the island, and Greek forces there are limited to the \"normal contingent called up for military service\". This record exists to track the permanent military presence on the island against that treaty obligation. The command's existence and its island are so far attested by a secondary source only; the primary source (the Hellenic Army General Staff or the Greek official gazette), the date it was established and the inventory of installations are still **not verified**. The point is the centre of the area OpenStreetMap has drawn as **Στρατηγείο 98 ΑΔΤΕ** (ODbL, `way/881040840`, queried 2026-09-20), with an uncertainty of ±500 m — half of what was drawn. A volunteer's tag is not a primary source: this is where the map shows the command's headquarters, not an official coordinate list. This is a compliance record, not targeting data: it carries no current movements, no personnel and no vulnerability assessment, and it never will. OpenStreetMap (ODbL, queried 2026-09-19, Greek territory only) has 8 features tagged as military on the island: military 6, barracks 1, range 1. Named: 221 ΤΕ - Στρατόπεδο Μακρή; ΣΕΑΛ; Στρατηγείο 98 ΑΔΤΕ; Στρατόπεδο Βούτσικα; Στρατόπεδο Κυριαζή; Polixnitos Firing Range. These are leads to verify: a volunteer's tag does not prove the facility belongs to this command, and the tags' currency has not been checked."
