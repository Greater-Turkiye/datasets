description:
  tr: "Limni adasında konuşlu, Yunan Kara Kuvvetlerine bağlı ada komutanlığı. Lozan (1923) md. 12 adayı Yunan egemenliğinde sayar; Limni ve Semadirek'in askerden arındırılmış statüsü Lozan'a ek Boğazlar Sözleşmesi'nden gelir ve 1936 Montrö sonrası statüsü taraflarca tartışmalıdır. Türkiye statünün sürdüğü görüşündedir. Bu kayıt, adadaki kalıcı askerî varlığın antlaşma yükümlülüğü karşısındaki durumunu izlemek için açılmıştır. Komutanlığın varlığı ve konuşlandığı ada bugün yalnızca ikincil bir kaynağa dayanmaktadır; birincil kaynak (Yunan Genelkurmayı veya Resmî Gazetesi), kuruluş tarihi ve tesis dökümü hâlâ **doğrulanmamıştır**. Kayıttaki nokta **adanın kendisidir**, tesisin değil: Limni adasının Wikidata'daki koordinatı (`Q192483`), hata payı ±12.3 km — adanın alanına eşit dairenin yarıçapı. Tesis düzeyinde bir koordinat, açık bir kaynak verene kadar yazılmaz; ayak izi ne çıkarılır ne yayımlanır (ADR 0021). Kayıt, hedefleme verisi değil, antlaşma uyum kaydıdır: güncel hareket, personel ve zafiyet bilgisi içermez ve içermeyecektir. OpenStreetMap'te (ODbL, sorgu 2026-09-19, yalnızca Yunan toprağı) adada askerî olarak etiketlenmiş 13 nesne kayıtlı: military 6, bunker 2, office 2, checkpoint 1, airfield 1, range 1. Adlandırılmış olanlar: Lemnos Air Base; Navtex station; Φρουράς Λήμνου; Πεδίο βολής Ατσικής. Bunlar doğrulanacak ipuçlarıdır: gönüllülerin etiketlediği kayıtlar bu komutanlığa ait olduklarını kanıtlamaz ve etiketlerin güncelliği denetlenmemiştir."
  en: "The Hellenic Army island command based on Lemnos. Lausanne (1923) Art. 12 confirms Greek sovereignty; the demilitarised status of Lemnos and Samothrace derives from the Straits Convention annexed to Lausanne, and what Montreux (1936) did to that status is disputed between the parties. Türkiye holds that it stands. This record exists to track the permanent military presence on the island against that treaty obligation. The command's existence and its island are so far attested by a secondary source only; the primary source (the Hellenic Army General Staff or the Greek official gazette), the date it was established and the inventory of installations are still **not verified**. The point is **the island itself**, not an installation: the Wikidata coordinate for Lemnos (`Q192483`), with an uncertainty of ±12.3 km — the radius of a circle with the island's area. A coordinate at installation level is written when an open source gives one; no footprint is traced or published. This is a compliance record, not targeting data: it carries no current movements, no personnel and no vulnerability assessment, and it never will. OpenStreetMap (ODbL, queried 2026-09-19, Greek territory only) has 13 features tagged as military on the island: military 6, bunker 2, office 2, checkpoint 1, airfield 1, range 1. Named: Lemnos Air Base; Navtex station; Φρουράς Λήμνου; Πεδίο βολής Ατσικής. These are leads to verify: a volunteer's tag does not prove the facility belongs to this command, and the tags' currency has not been checked."
