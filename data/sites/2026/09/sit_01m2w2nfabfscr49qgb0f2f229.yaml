description:
  tr: "Sakız adasında konuşlu, Yunan Kara Kuvvetlerine bağlı ada komutanlığı. Lozan Barış Antlaşması (1923) md. 13: adada deniz üssü ve istihkâm kurulamaz, Yunan kuvvetleri \"normal contingent called up for military service\" ile sınırlıdır. Bu kayıt, adadaki kalıcı askerî varlığın antlaşma yükümlülüğü karşısındaki durumunu izlemek için açılmıştır. Komutanlığın varlığı ve konuşlandığı ada bugün yalnızca ikincil bir kaynağa dayanmaktadır; birincil kaynak (Yunan Genelkurmayı veya Resmî Gazetesi), kuruluş tarihi, tesis dökümü ve koordinat **doğrulanmamıştır** ve bilerek boş bırakılmıştır (ADR 0019). Kayıt, hedefleme verisi değil, antlaşma uyum kaydıdır: güncel hareket, personel ve zafiyet bilgisi içermez ve içermeyecektir. OpenStreetMap'te (ODbL, sorgu 2026-09-19, yalnızca Yunan toprağı) adada askerî olarak etiketlenmiş 16 nesne kayıtlı: military 8, base 7, barracks 1. Bunlar doğrulanacak ipuçlarıdır: gönüllülerin etiketlediği kayıtlar bu komutanlığa ait olduklarını kanıtlamaz ve etiketlerin güncelliği denetlenmemiştir."
  en: "The Hellenic Army island command based on Chios. Treaty of Lausanne (1923) Art. 13: no naval base and no fortification may be established on the island, and Greek forces there are limited to the \"normal contingent called up for military service\". This record exists to track the permanent military presence on the island against that treaty obligation. The command's existence and its island are so far attested by a secondary source only; the primary source (the Hellenic Army General Staff or the Greek official gazette), the date it was established, the inventory of installations and the coordinates are **not verified** and are deliberately left empty (ADR 0019). This is a compliance record, not targeting data: it carries no current movements, no personnel and no vulnerability assessment, and it never will. OpenStreetMap (ODbL, queried 2026-09-19, Greek territory only) has 16 features tagged as military on the island: military 8, base 7, barracks 1. These are leads to verify: a volunteer's tag does not prove the facility belongs to this command, and the tags' currency has not been checked."
