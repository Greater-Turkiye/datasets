description:
  tr: "Ahikerya adasındaki askerî varlığın antlaşma yükümlülüğü karşısındaki durumunu izleyen kayıt. Lozan Barış Antlaşması (1923) md. 13: adada deniz üssü ve istihkâm kurulamaz; Yunan kuvvetleri \"normal contingent called up for military service\" ile sınırlıdır. Kayıtta koordinat ve geometri **yoktur**: bir koordinat, birincil kaynağıyla doğrulanmadan yazılmaz (ADR 0019). OpenStreetMap'te (sorgu 2026-09-19, yalnızca Yunan toprağı) adada askerî olarak etiketlenmiş hiçbir nesne yok. Bu, adada askerî varlık olmadığı anlamına gelmez; yalnızca açık haritada kayıt bulunmadığını gösterir. Kayıt bir uyum kaydıdır; güncel hareket, personel ve zafiyet bilgisi içermez ve içermeyecektir."
  en: "A record tracking the military presence on Ikaria against its treaty obligation. Treaty of Lausanne (1923) Art. 13: no naval base and no fortification may be established on the island, and Greek forces there are limited to the \"normal contingent called up for military service\". It carries **no coordinates and no geometry**: a coordinate is written when it has been verified against a primary source, not before (ADR 0019). OpenStreetMap (queried 2026-09-19, Greek territory only) has nothing tagged as military on the island. That is not evidence of absence: it only says the open map holds no record. This is a compliance record: it carries no current movements, no personnel and no vulnerability assessment, and it never will."
