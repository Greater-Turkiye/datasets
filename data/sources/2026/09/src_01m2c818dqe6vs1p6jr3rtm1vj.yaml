description:
  tr: 'Gönüllü alıcı ağına dayanan uçak takip servisi. Kullanım şartları (JETNET) verinin yayımlanmasını ve yeniden dağıtılmasını yasaklar; yalnızca ipucu olarak kullanılır, tek kaynak olamaz. Kırmızı çizgi:
