    label: {tr: Suriye, en: Syria}
    definition: {tr: "Suriye toprakları ve hava sahası.", en: "Syrian territory and airspace."}
  - code: iraq
    label: {tr: Irak, en: Iraq}
    definition: {tr: "Kuzey Irak dahil Irak toprakları.", en: "Iraq, including northern Iraq."}
