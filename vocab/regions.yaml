# İzleme bölgeleri — editoryal ilgi alanları, egemenlik iddiası değildir.
# Watch regions — editorial areas of interest, not sovereignty claims.
# Kodlar asla silinmez/yeniden kullanılmaz; kaldırmak için status: deprecated + replaced_by.
version: 1
codes:
